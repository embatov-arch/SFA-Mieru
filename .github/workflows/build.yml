
name: Build SFA 1.15 with Mieru

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Get official sing-box 1.15.0-alpha.13
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 824dbcfb4dd0a95921840b1737b950cde590241e
          path: sing-box
          persist-credentials: false

      - name: Get Mieru implementation from its author
        uses: actions/checkout@v4
        with:
          repository: enfein/mbox
          ref: 1c5b39718ebcd05e6adb31f95246fbf056be9bd7
          path: mbox
          persist-credentials: false

      - name: Get official SFA Android application
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: a548a7903e96266a0046018562c73b192edbfc18
          path: sing-box-for-android
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-37.1' 'ndk;28.0.13004108'

      - name: Add Mieru to official sing-box
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2

          core = Path('sing-box')
          source = Path('mbox')

          files = (
              'option/mieru.go',
              'protocol/mieru/inbound.go',
              'protocol/mieru/outbound.go',
          )

          for name in files:
              destination = core / name
              if destination.exists():
                  raise SystemExit(f'Already exists: {name}')
              destination.parent.mkdir(parents=True, exist_ok=True)
              copy2(source / name, destination)
              print('Added', name)

          def replace_once(relative, old, new):
              path = core / relative
              data = path.read_text(encoding='utf-8')
              count = data.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{relative}: expected one anchor, found {count}'
                  )
              path.write_text(
                  data.replace(old, new, 1),
                  encoding='utf-8'
              )

          replace_once(
              'constant/proxy.go',
              '\tTypeAnyTLS             = "anytls"\n',
              '\tTypeAnyTLS             = "anytls"\n'
              '\tTypeMieru              = "mieru"\n',
          )

          replace_once(
              'constant/proxy.go',
              '\tcase TypeAnyTLS:\n\t\treturn "AnyTLS"\n',
              '\tcase TypeAnyTLS:\n\t\treturn "AnyTLS"\n'
              '\tcase TypeMieru:\n\t\treturn "Mieru"\n',
          )

          replace_once(
              'include/registry.go',
              '\t"github.com/sagernet/sing-box/protocol/masque"\n',
              '\t"github.com/sagernet/sing-box/protocol/masque"\n'
              '\t"github.com/sagernet/sing-box/protocol/mieru"\n',
          )

          replace_once(
              'include/registry.go',
              '\tanytls.RegisterInbound(registry)\n',
              '\tanytls.RegisterInbound(registry)\n'
              '\tmieru.RegisterInbound(registry)\n',
          )

          replace_once(
              'include/registry.go',
              '\tanytls.RegisterOutbound(registry)\n',
              '\tanytls.RegisterOutbound(registry)\n'
              '\tmieru.RegisterOutbound(registry)\n',
          )

          print('Mieru integration applied.')
          PY

      - name: Install Mieru Go dependency
        working-directory: sing-box
        run: |
          go mod edit -require=github.com/enfein/mieru/v3@v3.38.0
          go mod tidy
          gofmt -w option/mieru.go protocol/mieru/inbound.go protocol/mieru/outbound.go
          git diff --check
          git status --short

      - name: Compile-test Mieru and registry
        working-directory: sing-box
        run: |
          go test ./protocol/mieru ./option ./include

      - name: Check Mieru JSON without Linux Cronet
        working-directory: sing-box
        run: |
          cat > /tmp/mieru-build-check.json <<'JSON'
          {
            "log": {
              "level": "warn"
            },
            "outbounds": [
              {
                "type": "mieru",
                "tag": "test-mieru",
                "server": "127.0.0.1",
                "server_port": 29999,
                "transport": "TCP",
                "username": "test-user",
                "password": "test-password"
              }
            ]
          }
          JSON

          go run \
            -tags with_quic,with_wireguard,with_utls,with_clash_api \
            ./cmd/sing-box check \
            -c /tmp/mieru-build-check.json

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare Android library folder
        run: |
          mkdir -p sing-box-for-android/app/libs

      - name: Build official sing-box Android libraries with Mieru
        working-directory: sing-box
        run: |
          go run ./cmd/internal/build_libbox -target android

      - name: Verify Android libraries
        run: |
          set -eu

          for file in libbox.aar libbox-legacy.aar; do
            test -s "sing-box-for-android/app/libs/$file"
            echo "Verified $file"
            unzip -l "sing-box-for-android/app/libs/$file" | grep 'classes.jar'
            unzip -l "sing-box-for-android/app/libs/$file" | grep 'arm64-v8a'
          done

          unzip -p \
            sing-box-for-android/app/libs/libbox.aar \
            classes.jar > /tmp/sfa-libbox-classes.jar

          test -s /tmp/sfa-libbox-classes.jar

          jar tf /tmp/sfa-libbox-classes.jar \
            | grep 'io/nekohasekai/libbox/' \
            | head -n 10

      - name: Set separate Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sing-box-for-android/app/build.gradle.kts')
          data = path.read_text(encoding='utf-8')

          old = 'applicationId = "io.nekohasekai.sfa"'
          new = 'applicationId = "io.nekohasekai.sfa.mieru"'

          if data.count(old) != 1:
              raise SystemExit('Original application ID not found once')

          path.write_text(
              data.replace(old, new, 1),
              encoding='utf-8'
          )
          PY

      - name: Build SFA Android APK
        working-directory: sing-box-for-android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --no-daemon

      - name: Upload APK and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SFA-Mieru-build-results
          path: |
            sing-box-for-android/app/build/outputs/apk/other/debug/*.apk
            sing-box-for-android/build/reports/problems/**
          if-no-files-found: warn
          retention-days: 7
